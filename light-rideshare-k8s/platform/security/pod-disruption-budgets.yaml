# ============================================================
# Apply to both clusters:
#
#   kubectl config use-context arn:aws:eks:us-east-1:...:cluster/light-rideshare-cluster
#   kubectl apply -f pod-disruption-budgets.yaml
#
#   kubectl config use-context partner-primary
#   kubectl apply -f pod-disruption-budgets.yaml
#
# Verify:
#   kubectl get pdb -n rideshare-app
# ============================================================
