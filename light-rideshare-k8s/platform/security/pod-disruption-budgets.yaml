
# PodDisruptionBudgets - Multi-Cluster RideShare
# Namespace: rideshare-app
# Applied to: Both light-rideshare-cluster (us-east-1)
#             and jibike-rideshare-cluster (us-east-2)


# --- Rider Service PDB ---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rider-service-pdb
  namespace: rideshare-app
  labels:
    app: rider-service
    part-of: rideshare
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: rider-service

---

# --- Driver Service PDB ---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: driver-service-pdb
  namespace: rideshare-app
  labels:
